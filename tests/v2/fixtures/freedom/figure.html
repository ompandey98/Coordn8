<!doctype html><html lang="en"><head><meta charset="utf-8"><title>tide ladder figure</title><style>:root{--c8-paper:#fef6e7;--c8-ink:#271e26;--c8-accent:#9a4694}body{background:var(--c8-paper);color:var(--c8-ink)}</style></head><body style="background-color:#fef6e7;color:#271e26"><input type="checkbox" id="tl-toggle" class="tl-toggle"><label class="tl-label-ctl" for="tl-toggle">Outline the longest wait</label><style>.tl-toggle:checked ~ .tl-fig .tl-last{stroke:var(--c8-ink);stroke-width:3}.tl-label-ctl{margin-left:.4rem}.tl-fig svg{width:100%;height:auto;display:block}.tl-rung{fill:var(--c8-paper);stroke:var(--c8-ink);stroke-width:1.5}.tl-label{fill:var(--c8-ink);font-size:14px}.tl-link{stroke:var(--c8-ink);stroke-width:2}.tl-wait{fill:var(--c8-accent)}</style><figure class="tl-fig" data-figure="fig-tide-ladder"><svg viewBox="0 0 500 180" role="img" aria-label="Four retry rungs; the wait before each one doubles: 1, 2, 4 and 8 seconds"><rect class="tl-rung" x="10" y="10" width="150" height="30" rx="4"/><text class="tl-label" x="20" y="30">Try 1: wait 1 s</text><rect class="tl-rung" x="10" y="50" width="150" height="30" rx="4"/><text class="tl-label" x="20" y="70">Try 2: wait 2 s</text><rect class="tl-rung" x="10" y="90" width="150" height="30" rx="4"/><text class="tl-label" x="20" y="110">Try 3: wait 4 s</text><rect class="tl-rung" x="10" y="130" width="150" height="30" rx="4"/><text class="tl-label" x="20" y="150">Try 4: wait 8 s</text><line class="tl-link" x1="85" y1="40" x2="85" y2="50"/><line class="tl-link" x1="85" y1="80" x2="85" y2="90"/><line class="tl-link" x1="85" y1="120" x2="85" y2="130"/><rect class="tl-wait" x="200" y="152" width="48" height="18" rx="4"/><rect class="tl-wait" x="270" y="134" width="48" height="36" rx="4"/><rect class="tl-wait" x="340" y="98" width="48" height="72" rx="4"/><rect class="tl-wait tl-last" x="410" y="26" width="48" height="144" rx="4"/></svg><figcaption>Each rung waits twice as long as the one above it; the tide of waiting is the height of the bars.</figcaption></figure></body></html>
