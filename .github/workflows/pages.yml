name: coordn8-pages

# Publishes the examples/ gallery (generated Coordn8 interactive pages) to
# GitHub Pages, so the README can link to a live demo. Enable Pages in repo
# Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main, master]
    paths: ["examples/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload examples as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples
      - id: deployment
        uses: actions/deploy-pages@v4
