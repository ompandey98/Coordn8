name: coordn8-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verbatim-sync + gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert adapters embed the brain verbatim (no drift)
        run: python3 build/generate_adapters.py --check

      - name: Run the test suite (verbatim + gates + parallel pool)
        run: python3 tests/run_tests.py

      - name: Environment/tier detection smoke
        run: python3 scripts/env_detect.py --json

      - name: Single-command setup plans the FULL toolchain (base + enhancements)
        run: python3 scripts/setup_env.py --dry-run --json

      - name: Visual-libs vendor plan smoke (free libs, downloads nothing)
        run: python3 scripts/render/fetch_visual_libs.py --dry-run

      - name: New render/gate scripts import & parse cleanly
        run: |
          python3 -m py_compile \
            scripts/render/subtitles.py \
            scripts/render/fetch_visual_libs.py \
            scripts/render/capture_scene.py \
            scripts/gates/subtitle_check.py \
            scripts/setup_env.py
          # subcommands must expose --help without importing optional render deps
          python3 scripts/render/subtitles.py --help >/dev/null
          python3 scripts/render/capture_scene.py --help >/dev/null

      - name: Gate runner smoke on an empty folder (everything SKIPS honestly, exit 0)
        run: |
          mkdir -p /tmp/coordn8-empty
          python3 scripts/run_gates.py /tmp/coordn8-empty

  lint-shell:
    name: shellcheck installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh || true   # advisory, mirrors Coordn8's own gate philosophy
